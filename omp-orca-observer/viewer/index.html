<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>omp task children</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 86rem;
      margin: 1.5rem auto;
      padding: 0 1rem;
      font: 1rem/1.5 system-ui, sans-serif;
      color: #202733;
      background: #f8fafc;
      overflow-wrap: anywhere;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0 0 .75rem;
    }

    h2 {
      font-size: 1.2rem;
    }

    h3 {
      font-size: 1rem;
    }

    #status {
      color: #8b1720;
      font-weight: 600;
    }

    #age,
    #inventory,
    .hint {
      color: #4b5563;
    }

    #view {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 1rem;
    }

    #view.dimmed {
      opacity: .6;
    }

    section,
    article,
    li {
      min-width: 0;
    }

    .panel {
      padding: 1rem;
      border: 1px solid #c5cbd3;
      border-radius: .5rem;
      background: white;
    }

    ul,
    ol {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .branch {
      padding-left: .75rem;
      border-left: 2px solid #c5cbd3;
    }

    .child {
      margin: .75rem 0;
      padding: .75rem;
      background: #f1f5f9;
      border-radius: .25rem;
    }

    button {
      max-width: 100%;
      padding: .5rem .75rem;
      border: 1px solid #64748b;
      border-radius: .25rem;
      background: white;
      color: inherit;
      font: inherit;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
    }

    .select-child {
      width: 100%;
      font-weight: 600;
    }

    button[aria-pressed="true"] {
      outline: 2px solid #2563eb;
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    dl {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: .25rem .75rem;
      margin: .75rem 0 0;
    }

    dt {
      font-weight: 600;
    }

    dd {
      margin: 0;
    }

    #entries>li {
      padding: .75rem 0;
      border-top: 1px solid #c5cbd3;
    }

    pre {
      margin: 0;
      font: .9rem/1.5 ui-monospace, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        margin: 1rem auto;
        padding: 0 .5rem;
      }

      #view {
        grid-template-columns: minmax(0, 1fr);
      }

      .panel,
      .child {
        padding: .5rem;
      }

      dl {
        grid-template-columns: minmax(0, 1fr);
        gap: .1rem;
      }

      dd {
        margin-bottom: .4rem;
      }

      .branch {
        padding-left: .4rem;
      }
    }
  </style>
</head>

<body>
  <h1>omp task children</h1>
  <p class="hint">Read-only observations. Activity is sampled, not proof of a run outcome.</p>
  <p id="status" role="status">Connecting…</p>
  <p id="age">Waiting for snapshot</p>
  <p id="inventory"></p>
  <main id="view">
    <section class="panel" aria-label="Granted children">
      <h2>Granted children</h2>
      <div id="children"></div>
    </section>
    <section class="panel" aria-label="Child transcript">
      <h2 id="transcript-title">Child transcript</h2>
      <p id="transcript-status" role="status">Select a child to read its transcript.</p>
      <ol id="entries"></ol>
      <button id="load-more" type="button" hidden>Load more</button>
    </section>
  </main>
  <script>
    (() => {
      const SCHEMA_VERSION = "1";
      const SCHEMA_HEADER = "x-observer-schema";
      const SESSION_ROUTE = "/v1/session";
      const SNAPSHOT_ROUTE = "/v1/snapshot";
      const TIMEOUT = Symbol("request timeout");
      const INCOMPATIBLE = Symbol("incompatible schema");
      const status = document.getElementById("status");
      const age = document.getElementById("age");
      const inventory = document.getElementById("inventory");
      const view = document.getElementById("view");
      const children = document.getElementById("children");
      const transcriptTitle = document.getElementById("transcript-title");
      const transcriptStatus = document.getElementById("transcript-status");
      const entries = document.getElementById("entries");
      const loadMore = document.getElementById("load-more");
      const controllers = new Set();
      const selectionButtons = new Map();
      let credential = null;
      let accepted = null;
      let awaitingEpoch = null;
      let receivedAt = null;
      let health = "waiting";
      let stopped = false;
      let polling = false;
      let pollTimer = null;
      let ageTimer = null;
      let selectedId = null;
      let token = "";
      let pageVersion = 0;
      let pageLoading = false;
      let pageController = null;

      const record = value => value !== null && typeof value === "object" && !Array.isArray(value);
      const count = value => Number.isSafeInteger(value) && value >= 0;
      const known = value => record(value) && (value.known === true
        ? typeof value.value === "string"
        : value.known === false && typeof value.reason === "string");
      const completeness = value => record(value) && (value.state === "complete"
        || (["partial", "unknown", "unavailable"].includes(value.state) && typeof value.reason === "string"));
      const formatKnown = value => value.known ? value.value : `unknown(${value.reason})`;
      const formatCompleteness = value => value.state === "complete" ? "complete" : `${value.state}(${value.reason})`;
      const lineageFields = ["repoRoot", "cwd", "parentWorktree", "childWorktree", "isolation", "branch"];
      const milestoneFields = ["responseAt", "acceptedAt", "terminalAt"];

      function validChild(child) {
        if (!record(child) || !["childId", "parentId", "rootSession", "agentName", "observedAt"].every(key => typeof child[key] === "string")
          || child.kind !== "sub" || !known(child.modelRole) || !known(child.resolvedModel)
          || !["running", "idle", "parked", "aborted"].includes(child.registryStatus) || typeof child.tombstoned !== "boolean"
          || !["none", "granted"].includes(child.grantScope) || !completeness(child.completeness)
          || !record(child.lineage) || !lineageFields.every(key => known(child.lineage[key]))
          || !record(child.milestones) || !milestoneFields.every(key => known(child.milestones[key]))
          || !record(child.activity) || child.activity.sampled !== true || !known(child.activity.lastActivityAt)
          || !record(child.outcome)) return false;
        return child.outcome.state === "unknown" ? typeof child.outcome.reason === "string"
          : ["started", "completed", "failed", "aborted"].includes(child.outcome.state)
          && count(child.outcome.generation) && known(child.outcome.spawnCallId) && typeof child.outcome.at === "string";
      }

      /**
       * @cc [label:product] viewer-epoch-replacement
       * A new epoch is admitted only as a complete schema-v1 inventory; malformed bodies cannot replace the last view.
       */
      function validSnapshot(snapshot) {
        return record(snapshot) && snapshot.schema === Number(SCHEMA_VERSION) && typeof snapshot.epoch === "string"
          && count(snapshot.generation) && typeof snapshot.observedAt === "string" && known(snapshot.rootSession)
          && completeness(snapshot.inventory) && Array.isArray(snapshot.children) && snapshot.children.every(validChild)
          && new Set(snapshot.children.map(child => child.childId)).size === snapshot.children.length;
      }

      function element(tag, text) {
        const node = document.createElement(tag);
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function showUnavailable(reason) {
        health = "unavailable";
        status.textContent = `unavailable(${reason})`;
        status.hidden = false;
        view.classList.add("dimmed");
      }

      function showStale() {
        health = "stale";
        status.textContent = "stale (no response within 10 s)";
        status.hidden = false;
      }

      function showAge() {
        age.textContent = receivedAt === null ? "No compatible snapshot received"
          : `Last snapshot received ${Math.floor((performance.now() - receivedAt) / 1000)} s ago`;
        if (health === "ready" && receivedAt !== null && performance.now() - receivedAt >= 10000) showStale();
      }

      function received() {
        receivedAt = performance.now();
        if (awaitingEpoch !== null) {
          showAge();
          return;
        }
        health = "ready";
        status.textContent = "";
        status.hidden = true;
        view.classList.remove("dimmed");
        showAge();
      }

      function clearTranscript() {
        pageVersion++;
        pageController?.abort();
        pageController = null;
        selectedId = null;
        token = "";
        pageLoading = false;
        entries.replaceChildren();
        transcriptTitle.textContent = "Child transcript";
        transcriptStatus.textContent = "Select a child to read its transcript.";
        loadMore.hidden = true;
        loadMore.disabled = false;
      }

      function stop(reason) {
        stopped = true;
        credential = null;
        clearInterval(pollTimer);
        clearInterval(ageTimer);
        for (const controller of controllers) controller.abort();
        accepted = null;
        receivedAt = null;
        awaitingEpoch = null;
        children.replaceChildren();
        selectionButtons.clear();
        inventory.textContent = "";
        clearTranscript();
        showUnavailable(reason);
        showAge();
      }

      /**
       * @cc [label:product] viewer-local-deadlines
       * Both fetch and body consumption are bounded by this page's clock, so a hung request cannot block later polls.
       */
      async function withDeadline(task, parentSignal) {
        const controller = new AbortController();
        const abort = () => controller.abort();
        if (parentSignal?.aborted) controller.abort();
        else parentSignal?.addEventListener("abort", abort, {once: true});
        controllers.add(controller);
        const timeout = Promise.withResolvers();
        const timer = setTimeout(() => {
          timeout.reject(TIMEOUT);
          controller.abort();
        }, 10000);
        try {
          return await Promise.race([task(controller.signal), timeout.promise]);
        } finally {
          clearTimeout(timer);
          parentSignal?.removeEventListener("abort", abort);
          controllers.delete(controller);
        }
      }

      /**
       * @cc [label:security] viewer-authorized-reads
       * Credentials live only in this closure and the authorization header. Incompatible bodies are never consumed.
       */
      async function authorized(url, parentSignal) {
        return withDeadline(async signal => {
          const response = await fetch(url, {
            cache: "no-store", credentials: "omit", signal,
            headers: {Authorization: `Bearer ${credential}`},
          });
          if (stopped || signal.aborted || parentSignal?.aborted) return null;
          if (response.status === 401) {
            stop("access ended");
            return null;
          }
          if (response.headers.get(SCHEMA_HEADER) !== SCHEMA_VERSION) {
            stop("incompatible");
            return null;
          }
          if (response.status !== 503 && !response.ok) {
            showUnavailable(`http ${response.status}`);
            return null;
          }
          const body = await response.json();
          if (stopped || signal.aborted || parentSignal?.aborted) return null;
          if (response.status === 503) {
            showUnavailable(record(body) && record(body.state) && typeof body.state.reason === "string"
              ? body.state.reason : "invalid unavailable state");
            return null;
          }
          return body;
        }, parentSignal);
      }

      function renderChild(child) {
        const item = element("li");
        const card = element("article");
        card.className = "child";
        const button = element("button", `${child.agentName} — ${child.childId}`);
        button.type = "button";
        button.className = "select-child";
        button.setAttribute("aria-pressed", String(child.childId === selectedId));
        button.addEventListener("click", () => selectChild(child.childId));
        selectionButtons.set(child.childId, button);
        card.append(button);
        const fields = element("dl");
        const field = (name, value) => fields.append(element("dt", name), element("dd", value));
        field("Child id", child.childId);
        field("Parent", child.parentId);
        field("Model role", formatKnown(child.modelRole));
        field("Resolved model", formatKnown(child.resolvedModel));
        field("Registry status", child.registryStatus + (child.tombstoned ? " — hard-killed (tombstone)" : ""));
        field("Current-run outcome", child.outcome.state === "unknown" ? `unknown(${child.outcome.reason})`
          : `${child.outcome.state} · generation ${child.outcome.generation} · spawnCallId ${formatKnown(child.outcome.spawnCallId)} · at ${child.outcome.at}`);
        for (const key of milestoneFields) field(key, formatKnown(child.milestones[key]));
        field("Activity (sampled)", formatKnown(child.activity.lastActivityAt));
        for (const key of lineageFields) field(key, formatKnown(child.lineage[key]));
        field("Completeness", formatCompleteness(child.completeness));
        card.append(fields);
        item.append(card);
        return item;
      }

      function renderTree(snapshot) {
        children.replaceChildren();
        selectionButtons.clear();
        const roots = new Map();
        for (const child of snapshot.children.filter(child => child.grantScope === "granted")) {
          if (!roots.has(child.rootSession)) roots.set(child.rootSession, new Map());
          const worktrees = roots.get(child.rootSession);
          const key = JSON.stringify([child.lineage.parentWorktree, child.lineage.childWorktree]
            .map(worktree => [worktree.known, worktree.known ? worktree.value : worktree.reason]));
          if (!worktrees.has(key)) worktrees.set(key, []);
          worktrees.get(key).push(child);
        }
        for (const [root, worktrees] of roots) {
          const section = element("section");
          section.append(element("h2", `Root session: ${root}`));
          for (const rows of worktrees.values()) {
            const group = element("section");
            group.append(element("h3", `Worktree: ${formatKnown(rows[0].lineage.parentWorktree)} → ${formatKnown(rows[0].lineage.childWorktree)}`));
            const list = element("ul");
            const ids = new Set(rows.map(child => child.childId));
            const descendants = new Map();
            for (const child of rows) {
              if (!descendants.has(child.parentId)) descendants.set(child.parentId, []);
              descendants.get(child.parentId).push(child);
            }
            const seen = new Set();
            const branch = (child, target) => {
              if (seen.has(child.childId)) return;
              seen.add(child.childId);
              const item = renderChild(child);
              const nested = element("ul");
              nested.className = "branch";
              for (const next of descendants.get(child.childId) || []) branch(next, nested);
              if (nested.childNodes.length) item.append(nested);
              target.append(item);
            };
            for (const child of rows) if (!ids.has(child.parentId)) branch(child, list);
            // Retain every granted row even when parent evidence contains a cycle.
            for (const child of rows) branch(child, list);
            group.append(list);
            section.append(group);
          }
          children.append(section);
        }
        if (!roots.size) children.append(element("p", "No granted children in this snapshot."));
      }

      async function poll() {
        if (stopped || polling) return;
        polling = true;
        try {
          const snapshot = await authorized(SNAPSHOT_ROUTE);
          if (stopped || snapshot === null) return;
          if (record(snapshot) && accepted && snapshot.epoch === accepted.epoch && count(snapshot.generation)
            && (awaitingEpoch !== null || snapshot.generation <= accepted.generation)) {
            received();
            return;
          }
          if (!validSnapshot(snapshot)) {
            if (record(snapshot) && typeof snapshot.epoch === "string" && (!accepted || snapshot.epoch !== accepted.epoch)) awaitingEpoch = snapshot.epoch;
            showUnavailable("invalid snapshot");
            return;
          }
          const newEpoch = !accepted || accepted.epoch !== snapshot.epoch;
          if (newEpoch && snapshot.inventory.state !== "complete") {
            awaitingEpoch = snapshot.epoch;
            showUnavailable(snapshot.inventory.reason);
            return;
          }
          awaitingEpoch = null;
          if (newEpoch || !snapshot.children.some(child => child.childId === selectedId && child.grantScope === "granted")) clearTranscript();
          accepted = snapshot;
          inventory.textContent = `Inventory: ${formatCompleteness(snapshot.inventory)} · Root: ${formatKnown(snapshot.rootSession)} · Epoch: ${snapshot.epoch} · Generation: ${snapshot.generation}`;
          renderTree(snapshot);
          received();
        } catch (error) {
          if (!stopped) {
            if (error === TIMEOUT) {
              if (awaitingEpoch === null) showStale();
            }
            else showUnavailable("unreachable");
          }
        } finally {
          polling = false;
          showAge();
        }
      }

      function selectChild(id) {
        if (stopped || !accepted || !accepted.children.some(child => child.childId === id && child.grantScope === "granted")) return;
        clearTranscript();
        selectedId = id;
        transcriptTitle.textContent = `Transcript: ${id}`;
        for (const [childId, button] of selectionButtons) button.setAttribute("aria-pressed", String(childId === id));
        void loadPage();
      }

      function renderEntry(entry) {
        const item = element("li");
        const message = record(entry) && record(entry.message) ? entry.message : entry;
        const role = record(message) && typeof message.role === "string" ? message.role : "entry";
        let text;
        if (record(message)) {
          if (typeof message.content === "string") text = message.content;
          else if (Array.isArray(message.content)) {
            const parts = message.content.filter(part => record(part) && part.type === "text" && typeof part.text === "string");
            if (parts.length) text = parts.map(part => part.text).join("\n");
          } else if (typeof message.text === "string") text = message.text;
        }
        item.append(element("h3", role), element("pre", text === undefined ? JSON.stringify(entry) : text));
        entries.append(item);
      }

      async function loadPage() {
        if (stopped || !accepted || selectedId === null || pageLoading) return;
        const version = pageVersion;
        const id = selectedId;
        const epoch = accepted.epoch;
        const controller = new AbortController();
        pageController = controller;
        pageLoading = true;
        loadMore.disabled = true;
        transcriptStatus.textContent = "Loading…";
        try {
          const query = new URLSearchParams({token, mode: "entries"});
          const result = await authorized(`/v1/children/${encodeURIComponent(id)}/page?${query}`, controller.signal);
          if (stopped || version !== pageVersion || controller.signal.aborted || !accepted || accepted.epoch !== epoch) return;
          if (result === null) {
            transcriptStatus.textContent = status.textContent;
            return;
          }
          if (record(result) && result.kind === "unavailable" && ["missing", "stale", "cancelled", "unreadable"].includes(result.reason)) {
            transcriptStatus.textContent = `unavailable(${result.reason})`;
            return;
          }
          const page = record(result) && result.kind === "page" && result.mode === "entries" && Array.isArray(result.entries)
            && count(result.malformed) && typeof result.atEnd === "boolean";
          const large = record(result) && result.kind === "record_too_large" && count(result.start)
            && (result.end === null || count(result.end)) && count(result.scannedTo);
          if ((!page && !large) || typeof result.reset !== "boolean" || typeof result.token !== "string") {
            transcriptStatus.textContent = "unavailable(invalid transcript page)";
            return;
          }
          if (result.reset) entries.replaceChildren();
          const notices = result.reset ? ["Transcript reset; restarted from byte zero."] : [];
          if (page) {
            for (const entry of result.entries) renderEntry(entry);
            if (result.malformed) notices.push(`Malformed records: ${result.malformed}.`);
            loadMore.hidden = result.atEnd;
          } else {
            entries.append(element("li", `Record too large: bytes ${result.start}–${result.end === null ? "unknown(record end beyond bounded scan)" : result.end}; scanned through ${result.scannedTo}.`));
            loadMore.hidden = false;
          }
          token = result.token;
          transcriptStatus.textContent = notices.join(" ") || (page && result.atEnd ? "End of transcript." : "More transcript available.");
        } catch (error) {
          if (!stopped && version === pageVersion && !controller.signal.aborted) {
            if (error === TIMEOUT) showStale();
            else showUnavailable("unreachable");
            transcriptStatus.textContent = status.textContent;
          }
        } finally {
          if (version === pageVersion) {
            pageController = null;
            pageLoading = false;
            loadMore.disabled = false;
          }
        }
      }

      loadMore.addEventListener("click", () => void loadPage());

      async function start() {
        const code = new URLSearchParams(location.hash.slice(1)).get("code");
        history.replaceState(null, "", location.pathname + location.search);
        if (!code) {
          stop("access not granted");
          return;
        }
        try {
          const session = await withDeadline(async signal => {
            const response = await fetch(SESSION_ROUTE, {
              method: "POST", cache: "no-store", credentials: "omit", signal,
              headers: {"Content-Type": "application/json"}, body: JSON.stringify({code}),
            });
            if (response.headers.get(SCHEMA_HEADER) !== SCHEMA_VERSION) throw INCOMPATIBLE;
            if (!response.ok) throw new Error("exchange failed");
            return response.json();
          });
          if (!record(session) || typeof session.credential !== "string" || !session.credential) throw new Error("exchange failed");
          credential = session.credential;
          pollTimer = setInterval(() => void poll(), 2000);
          ageTimer = setInterval(showAge, 1000);
          void poll();
        } catch (error) {
          stop(error === INCOMPATIBLE ? "incompatible" : "access not granted");
        }
      }

      showAge();
      void start();
    })();
  </script>
</body>

</html>
